<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title description">
  <title id="title">Word Relay</title>
  <desc id="description">Word Relay. Live letter scanning and fast, offline suggestions. Three mint tile shapes spell REL on a dark teal field.</desc>
  <defs>
    <linearGradient id="background"><stop stop-color="#111b21"/><stop offset=".69" stop-color="#14282a"/><stop offset="1" stop-color="#1d3936"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#73ebbb" stop-opacity=".17"/><stop offset="1" stop-color="#73ebbb" stop-opacity="0"/></radialGradient>
    <linearGradient id="tile" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#cafce4"/><stop offset="1" stop-color="#80e4b9"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#85cbb3" stroke-width="1" opacity=".15"/></pattern>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="378" rx="33"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <path d="M0 0h1200v380H0z" fill="url(#background)"/>
    <ellipse cx="978" cy="172" rx="378" ry="265" fill="url(#glow)"/>
    <path d="M700 0h500v380H650z" fill="url(#grid)"/>
    <path d="M702 0 653 380" stroke="#6fa596" stroke-opacity=".2"/>
    <rect x="66" y="66" width="56" height="56" rx="15" fill="#1d3c35" stroke="#4f7465"/>
    <path d="m81 86 4 16h4.6l3.4-10.2 3.4 10.2h4.6l4-16h-4.5l-2 10-3.4-10h-4.1l-3.4 10-2-10Z" fill="#b8f8da"/>
    <text x="137" y="101" fill="#a6dac8" font-family="system-ui, sans-serif" font-size="21" font-weight="600">Word game companion</text>
    <text x="65" y="207" fill="#effaf6" font-family="system-ui, sans-serif" font-size="82" font-weight="750" letter-spacing="-4">Word <tspan fill="#b8f8da">Relay</tspan></text>
    <text x="69" y="252" fill="#bccfc9" font-family="system-ui, sans-serif" font-size="25">Live letter scanning. Fast, offline suggestions.</text>
    <rect x="69" y="286" width="180" height="38" rx="19" fill="#25443c"/>
    <text x="159" y="310.5" fill="#c8f5e3" font-family="system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="middle">106,179 English words</text>
    <rect x="265" y="286" width="118" height="38" rx="19" fill="#203a35" stroke="#45675d"/>
    <text x="324" y="310.5" fill="#bddbd0" font-family="system-ui, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Offline lookup</text>
    <g transform="rotate(-12 825 178)">
      <rect x="762" y="125" width="126" height="126" rx="25" fill="#0a1d1c" opacity=".57"/>
      <rect x="762" y="117" width="126" height="126" rx="25" fill="#285349" stroke="#679c89" stroke-width="2"/>
      <text x="825" y="207" fill="#bdedda" text-anchor="middle" font-family="system-ui, sans-serif" font-size="72" font-weight="750">R</text>
    </g>
    <g transform="rotate(12 1050 185)">
      <rect x="987" y="127" width="126" height="126" rx="25" fill="#0a1d1c" opacity=".57"/>
      <rect x="987" y="119" width="126" height="126" rx="25" fill="#30594e" stroke="#78a997" stroke-width="2"/>
      <text x="1050" y="208" fill="#c4eddf" text-anchor="middle" font-family="system-ui, sans-serif" font-size="72" font-weight="750">L</text>
    </g>
    <g transform="rotate(-2 935 180)">
      <rect x="862" y="115" width="146" height="146" rx="28" fill="#0b2320" opacity=".48"/>
      <rect x="862" y="105" width="146" height="146" rx="28" fill="url(#tile)"/>
      <text x="935" y="208" fill="#14382e" text-anchor="middle" font-family="system-ui, sans-serif" font-size="85" font-weight="780">E</text>
    </g>
    <path d="M761 91V70h21m320 0h21v21m0 190v21h-21m-320 0h-21v-21" fill="none" stroke="#83c9ad" stroke-width="3" stroke-linecap="round" stroke-opacity=".72"/>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="33" fill="none" stroke="#43685d" stroke-width="2"/>
</svg>
